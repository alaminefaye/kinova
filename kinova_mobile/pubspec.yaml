name: kinova_mobile
description: "KINOVA — boutique en ligne mobile."
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  intl: ^0.20.2
  http: ^1.6.0
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  geolocator: ^14.1.1
  url_launcher: ^6.3.2
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#140C07"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/fonts/pdf/
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
